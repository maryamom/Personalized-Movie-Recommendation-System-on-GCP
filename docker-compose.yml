version: '3.8'

services:
  movie-recommendation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-recommendation-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GOOGLE_CLOUD_PROJECT=students-group3
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount GCP credentials if running locally
      # Uncomment and adjust path if needed:
      # - ~/.config/gcloud:/root/.config/gcloud:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

